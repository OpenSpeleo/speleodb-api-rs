[package]
name = "speleodb-api-xtask"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1"
heck = "0.5"
openapi-to-rust = { version = "=0.23.0", default-features = false }
prettyplease = "0.3"
proc-macro2 = "1"
quote = "1"
semver = "1"
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
syn = { version = "3", features = ["full", "parsing", "visit", "visit-mut"] }
tempfile = "3"
toml = "1.1"
