---
exclude: ^(target/|xtask/target/|src/generated/|OpenAPI\.yaml$)

minimum_prek_version: "0.2.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # -------------------------
  # Formatting
  # -------------------------
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.10
    hooks:
      - id: prettier
        name: prettier
        types_or: [markdown, toml, yaml, json]
        args: [--prose-wrap=always]

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
      - id: taplo-lint
        # Schemas are associated explicitly in .taplo.toml.
        args: []

  # -------------------------
  # CI formatting
  # -------------------------
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  # -------------------------
  # Script formatting
  # -------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  # -------------------------
  # Security/License Check
  # -------------------------
  - repo: https://github.com/EmbarkStudios/cargo-deny
    rev: 0.20.2
    hooks:
      - id: cargo-deny
        args: [--locked, --all-features, check]
        always_run: true
      - id: cargo-deny
        alias: xtask-cargo-deny
        name: Check generator dependencies
        args:
          - --manifest-path
          - xtask/Cargo.toml
          - --config
          - deny.toml
          - --locked
          - --all-features
          - check
        always_run: true

  - repo: local
    hooks:
      - id: cargo-audit
        name: Check Rust dependencies for vulnerabilities
        entry: cargo audit
        language: system
        files: ^Cargo\.lock$
        pass_filenames: false
      - id: xtask-cargo-audit
        name: Check generator dependencies for vulnerabilities
        entry: cargo audit --file xtask/Cargo.lock
        language: system
        files: ^xtask/Cargo\.lock$
        pass_filenames: false

  # -------------------------
  # Unused Dependency Check
  # -------------------------
  - repo: https://github.com/bnjbvr/cargo-machete
    rev: v0.9.2 # Replace with a specific tag/version if preferred
    hooks:
      - id: cargo-machete
        args: [--with-metadata]

  # -------------------------
  # Rust Check
  # -------------------------
  - repo: local
    hooks:
      - id: generated-sdk-sync
        name: Verify generated Rust matches the local OpenAPI snapshot
        entry: cargo xtask check
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: rustfmt
        name: Rust formatting
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        always_run: true

      - id: xtask-rustfmt
        name: Generator tooling formatting
        entry: cargo fmt --manifest-path xtask/Cargo.toml -- --check
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: clippy
        name: Rust Clippy
        entry: cargo clippy --locked --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
        always_run: true

      - id: xtask-clippy
        name: Generator tooling Clippy
        entry: >
          cargo clippy --manifest-path xtask/Cargo.toml --locked --all-targets
          -- -D warnings
        language: system
        pass_filenames: false
        always_run: true
